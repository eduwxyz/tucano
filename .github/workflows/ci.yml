# Every pull request and every push to main: typecheck, tests and the app's
# build, on macOS, Linux and Windows, so a change can't break one of them unnoticed.
# A pull request waits for the slowest runner, so each system's tests are split across
# several, by how long each file takes there (test/helpers/shards.ts): the runners are
# free for a public repository, and up to 20 run at once (5 of them macOS). Windows runs
# the same tests about twice as slow and takes 50 s to set up, so it gets the most; a
# sixth runner there would not help, since its longest file alone takes about a minute.
# macOS's runners have two test workers where the others have three. A pull request runs
# the heaviest randomized tests with fewer rounds (TUCANO_QUICK_TESTS); main runs them all.
name: CI

on:
  pull_request:
    paths-ignore: ['site/**', 'docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1/2 }
          - { os: ubuntu-latest, shard: 2/2 }
          - { os: macos-latest, shard: 1/4 }
          - { os: macos-latest, shard: 2/4 }
          - { os: macos-latest, shard: 3/4 }
          - { os: macos-latest, shard: 4/4 }
          - { os: windows-latest, shard: 1/5 }
          - { os: windows-latest, shard: 2/5 }
          - { os: windows-latest, shard: 3/5 }
          - { os: windows-latest, shard: 4/5 }
          - { os: windows-latest, shard: 5/5 }
    runs-on: ${{ matrix.os }}
    env:
      # The tests and the build don't run Electron itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      TUCANO_QUICK_TESTS: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      # Defender scans every file the tests write (databases, temp folders), which is
      # most of Windows' extra time. The runner is thrown away after the job.
      - if: runner.os == 'Windows'
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, "$env:USERPROFILE\AppData\Local\npm-cache"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: startsWith(matrix.shard, '1/') # once per system
        run: npm run typecheck
      - run: npx vitest run --shard=${{ matrix.shard }}
      - if: startsWith(matrix.shard, '1/') # once per system
        run: npm run build

